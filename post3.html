<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШКИТ — Давай сыграем жизнь</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap&subset=cyrillic,latin" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        background: #2a2a2a;
        min-height: 100vh;
        padding: 40px 20px 120px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* ============================================================
       ПЛАКАТ 1080×1920
       ============================================================ */
    .post {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #8C1D24;
        color: #fff;
        isolation: isolate;
        box-shadow: 0 40px 120px -30px rgba(0,0,0,.8);
        flex: none;
    }

    @media (max-width: 1180px), (max-height: 2000px) {
        html, body { padding: 20px 10px 100px; }
        .post { zoom: .48; }
    }
    @media (max-width: 640px) {
        .post { zoom: .32; }
    }

    /* ============================================================
       ФОН — красный + свет + пыль + штамп + сетка
       ============================================================ */

    .post__bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(120% 85% at 50% 28%,
                #B0242C 0%,
                #8C1D24 40%,
                #6B131A 75%,
                #4A0D13 100%);
    }

    .post__lights {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
            radial-gradient(28% 68% at 30% 0%,
                rgba(255,240,225,.34) 0%,
                rgba(255,225,210,.16) 35%,
                rgba(255,220,200,0)   70%),
            radial-gradient(32% 78% at 50% 0%,
                rgba(255,245,235,.46) 0%,
                rgba(255,235,220,.24) 35%,
                rgba(255,225,205,0)   72%),
            radial-gradient(28% 68% at 70% 0%,
                rgba(255,240,225,.34) 0%,
                rgba(255,225,210,.16) 35%,
                rgba(255,220,200,0)   70%),
            radial-gradient(24% 60% at 32% 1%,
                rgba(255,235,215,.18) 0%,
                rgba(255,220,200,0)   60%),
            radial-gradient(26% 66% at 68% 1%,
                rgba(255,235,215,.18) 0%,
                rgba(255,220,200,0)   60%);
    }

    .post__haze {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
            radial-gradient(52% 24% at 50% 4%,
                rgba(255,240,220,.24) 0%,
                rgba(255,215,180,.10) 40%,
                rgba(0,0,0,0) 75%);
    }

    .post__dust {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        opacity: .55;
        background-image:
            radial-gradient(circle at 20% 30%, rgba(255,240,220,.85) 0.5px, transparent 1.5px),
            radial-gradient(circle at 70% 15%, rgba(255,235,210,.7)  0.5px, transparent 1.5px),
            radial-gradient(circle at 45% 60%, rgba(255,240,220,.6)  0.5px, transparent 1.5px),
            radial-gradient(circle at 85% 45%, rgba(255,235,210,.55) 0.5px, transparent 1.5px),
            radial-gradient(circle at 12% 75%, rgba(255,240,220,.5)  0.5px, transparent 1.5px);
        background-size:
            180px 180px,
            260px 260px,
            220px 220px,
            300px 300px,
            340px 340px;
        -webkit-mask-image: linear-gradient(180deg,
            rgba(0,0,0,1) 0%,
            rgba(0,0,0,.7) 40%,
            rgba(0,0,0,.2) 70%,
            rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(180deg,
            rgba(0,0,0,1) 0%,
            rgba(0,0,0,.7) 40%,
            rgba(0,0,0,.2) 70%,
            rgba(0,0,0,0) 100%);
    }

    .post__wordmark {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .post__wordmark span {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 520px;
        letter-spacing: -.06em;
        text-transform: uppercase;
        color: rgba(255,240,220,.055);
        white-space: nowrap;
        transform: rotate(-7deg) translateY(-30px);
        line-height: .8;
        user-select: none;
    }

    .post__grid {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: .035;
        background-image:
            repeating-linear-gradient(0deg,
                rgba(255,255,255,1) 0 1px,
                transparent 1px 60px),
            repeating-linear-gradient(90deg,
                rgba(255,255,255,1) 0 1px,
                transparent 1px 60px);
    }

    .post__vignette {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        background:
            radial-gradient(130% 95% at 50% 50%,
                rgba(0,0,0,0) 45%,
                rgba(0,0,0,.28) 82%,
                rgba(0,0,0,.5) 100%);
    }

    .post__grain {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        opacity: .12;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        background-size: 120px 120px;
    }

    .post__frame {
        position: absolute;
        inset: 28px;
        z-index: 8;
        pointer-events: none;
        border: 2px solid rgba(244,199,123,.5);
    }
    .post__frame::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(244,199,123,.25);
    }

    /* ============================================================
       КОНТЕНТ
       ============================================================ */
    .post__content {
        position: relative;
        z-index: 10;
        height: 100%;
        padding: 72px 88px 80px;
        display: flex;
        flex-direction: column;
    }

    /* ---------- ВЕРХ ---------- */
    .post__top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 84px;
        flex: none;
    }

    .post__logo {
        display: flex;
        align-items: center;
        gap: 18px;
    }
    .post__logo img {
        height: 84px;
        width: auto;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(0,0,0,.5));
    }

    .post__logo-text b {
        display: block;
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: .01em;
        text-shadow: 0 6px 20px rgba(0,0,0,.55);
    }
    /* Подпись лого — крупнее: 15 → 17 */
    .post__logo-text span {
        display: block;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: rgba(255,255,255,.88);
        margin-top: 8px;
        text-shadow: 0 4px 14px rgba(0,0,0,.55);
    }

    .post__stamp {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #3a0a0d;
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
        padding: 20px 34px;
        border-radius: 8px;
        transform: rotate(2deg);
        box-shadow:
            0 18px 40px -10px rgba(0,0,0,.6),
            inset 0 1px 0 rgba(255,255,255,.5);
        white-space: nowrap;
    }

    /* ---------- ЗАГОЛОВОК — теперь с наклоном ---------- */
    .post__hero {
        flex: none;
        margin-top: 48px;
        /* наклон всего блока, как у плашки «3 месяца подготовки»,
           только в другую сторону — для «расклеенности» */
        transform: rotate(-2.5deg);
        transform-origin: left center;
        /* компенсируем сдвиг от поворота, чтобы не вылезло за рамку */
        margin-left: -6px;
    }

    .title {
        display: flex;
        flex-direction: column;
        line-height: .84;
        letter-spacing: -.03em;
        text-transform: uppercase;
        font-weight: 900;
    }

    .title__row { display: block; }

    .title__row--1 {
        font-size: 114px;
        font-weight: 800;
        font-style: italic;
        color: #fff;
        margin-left: 4px;
        text-shadow: 0 10px 34px rgba(0,0,0,.6);
    }
    .title__row--2 {
        font-size: 130px;
        font-weight: 900;
        font-style: italic;
        color: #fff;
        margin-left: 30px;
        text-shadow: 0 10px 34px rgba(0,0,0,.6);
    }
    .title__row--3 {
        font-size: 198px;
        font-weight: 900;
        color: #F4C77B;
        margin-top: 4px;
        letter-spacing: -.05em;
        text-shadow:
            -2px -2px 0 rgba(30,10,10,.55),
             2px -2px 0 rgba(30,10,10,.55),
            -2px  2px 0 rgba(30,10,10,.55),
             2px  2px 0 rgba(30,10,10,.55),
             0 14px 46px rgba(0,0,0,.7);
    }

    /* ---------- ФОТО — наклон в другую сторону ---------- */
    .post__photo {
        position: relative;
        height: 660px;
        flex: none;
        margin-top: 40px;
        overflow: hidden;
        box-shadow:
            0 34px 80px -22px rgba(0,0,0,.8),
            0 0 0 4px rgba(244,199,123,.45),
            0 0 0 5px rgba(0,0,0,.55);
        background-image: url('assets/img/gal104.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        /* наклон в противоположную сторону от заголовка */
        transform: rotate(1.5deg);
        transform-origin: center center;
    }

    .post__photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
            rgba(0,0,0,0) 60%,
            rgba(0,0,0,.45) 100%);
        pointer-events: none;
    }

    /* Стикер */
    .sticker {
        position: absolute;
        right: 28px;
        bottom: 28px;
        z-index: 4;
        background: #FFF7E6;
        color: #2a1a0a;
        padding: 24px 34px 26px;
        border-radius: 10px;
        transform: rotate(-4deg);
        box-shadow:
            0 26px 60px -14px rgba(0,0,0,.75),
            0 0 0 3px rgba(255,247,230,.4);
    }
    .sticker__label {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #A02424;
        margin-bottom: 8px;
    }
    .sticker__text {
        font-size: 34px;
        font-weight: 900;
        line-height: 1.05;
        text-transform: uppercase;
    }
    .sticker::before {
        content: "";
        position: absolute;
        top: -16px;
        left: 50%;
        width: 120px;
        height: 32px;
        transform: translateX(-50%) rotate(-2deg);
        background: rgba(255,255,255,.28);
        border: 1px solid rgba(255,255,255,.5);
    }

    /* ---------- ВЫЗОВ ---------- */
    .post__punch {
        flex: none;
        margin-top: 42px;
        font-size: 44px;
        font-weight: 800;
        line-height: 1.2;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 8px 26px rgba(0,0,0,.6);
    }
    .post__punch span { display: block; }
    .post__punch em {
        font-style: italic;
        color: #F4C77B;
    }

    /* ============================================================
       НИЗ
       ============================================================ */
    .post__bottom {
        flex: none;
        margin-top: auto;
        padding-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }

    .facts {
        display: grid;
        grid-template-columns: 1fr 1fr 1.35fr;
        gap: 16px;
    }

    .fact {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 20px 26px;
        height: 108px;
        border-radius: 16px;
        background: rgba(255,247,230,.95);
        color: #2a1a0a;
        box-shadow: 0 16px 36px -12px rgba(0,0,0,.6);
        overflow: hidden;
    }
    /* Лейблы плашек — крупнее: 16 → 18 */
    .fact__label {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #A02424;
        white-space: nowrap;
    }
    .fact__value {
        font-size: 30px;
        font-weight: 900;
        color: #2a1a0a;
        line-height: 1;
        white-space: nowrap;
    }
    .fact--price {
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
    }
    .fact--price .fact__label { color: #6b2a0a; }
    .fact--price .fact__value { color: #2a1a0a; }

    /* QR-строка — теперь УЖЕ, по центру, QR слева, текст справа */
    .qr-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
        background: rgba(30,6,9,.55);
        border: 2px solid rgba(244,199,123,.4);
        border-radius: 18px;
        padding: 24px 40px;
        min-height: 224px;
        /* не на всю ширину — уже и по центру */
        width: 92%;
        margin: 0 auto;
    }

    /* QR — теперь СЛЕВА */
    .qr__img {
        width: 190px;
        height: 190px;
        background: #FFF7E6;
        border-radius: 12px;
        padding: 10px;
        object-fit: contain;
        display: block;
        box-shadow: 0 14px 34px -12px rgba(0,0,0,.7);
        flex: none;
    }

    /* Текст — теперь СПРАВА */
    .qr__text {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 420px;
    }
    .qr__title {
        font-size: 34px;
        font-weight: 900;
        line-height: 1.1;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: .04em;
        text-shadow: 0 6px 18px rgba(0,0,0,.6);
    }
    .qr__title span {
        display: block;
        color: #F4C77B;
    }
    /* Подпись — крупнее: 17 → 19 */
    .qr__hint {
        font-size: 19px;
        font-weight: 600;
        line-height: 1.35;
        color: rgba(255,255,255,.8);
    }

    /* ============================================================
       КНОПКА ЭКСПОРТА
       ============================================================ */
    .export-bar {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 999;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .export-btn {
        font-family: inherit;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #2a1a0a;
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
        border: none;
        border-radius: 10px;
        padding: 14px 22px;
        cursor: pointer;
        box-shadow: 0 14px 32px -8px rgba(0,0,0,.7);
        transition: transform .15s ease;
    }
    .export-btn:hover { transform: translateY(-2px); }
    .export-btn:active { transform: translateY(0); }
    .export-btn:disabled { opacity: .6; cursor: wait; transform: none; }

    .export-status {
        font-size: 12px;
        font-weight: 700;
        color: rgba(255,255,255,.75);
        background: rgba(0,0,0,.45);
        padding: 8px 14px;
        border-radius: 999px;
    }

    .export-hide {
        font-size: 12px;
        font-weight: 700;
        color: rgba(255,255,255,.55);
        background: rgba(0,0,0,.35);
        border: none;
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
        font-family: inherit;
    }
</style>
</head>
<body>

<div class="post" id="post">

    <div class="post__bg"></div>
    <div class="post__lights"></div>
    <div class="post__haze"></div>
    <div class="post__dust"></div>
    <div class="post__wordmark"><span>Сцена</span></div>
    <div class="post__grid"></div>
    <div class="post__vignette"></div>
    <div class="post__grain"></div>
    <div class="post__frame"></div>

    <div class="post__content">

        <!-- Верх -->
        <div class="post__top">
            <div class="post__logo">
                <img src="assets/img/logo-white-sm.png" alt="ШКИТ">
                <div class="post__logo-text">
                    <b>ШКИТ</b>
                    <span>Школа кино и театра</span>
                </div>
            </div>
            <div class="post__stamp">3 месяца подготовки</div>
        </div>

        <!-- Заголовок — с наклоном -2.5° -->
        <div class="post__hero">
            <h1 class="title">
                <span class="title__row title__row--1">Давай</span>
                <span class="title__row title__row--2">Сыграем</span>
                <span class="title__row title__row--3">Жизнь</span>
            </h1>
        </div>

        <!-- Фото — с наклоном +1.5° -->
        <div class="post__photo">
            <div class="sticker">
                <div class="sticker__label">В подарок</div>
                <div class="sticker__text">Фотосессия</div>
            </div>
        </div>

        <!-- Вызов -->
        <div class="post__punch">
            <span>Главная роль в спектакле</span>
            <span><em>на театральной сцене</em></span>
        </div>

        <!-- Низ -->
        <div class="post__bottom">

            <div class="facts">
                <div class="fact">
                    <span class="fact__label">Ср · Вс</span>
                    <span class="fact__value">18:00 / 10:00</span>
                </div>
                <div class="fact fact--price">
                    <span class="fact__label">Проект</span>
                    <span class="fact__value">56 000 ₽</span>
                </div>
                <div class="fact">
                    <span class="fact__label">Запись</span>
                    <span class="fact__value">+7 919 404-01-23</span>
                </div>
            </div>

            <!-- QR-строка: QR слева, текст справа, по центру -->
            <div class="qr-row">
                <img class="qr__img" src="assets/img/qr.png" alt="QR">
                <div class="qr__text">
                    <div class="qr__title">
                        Запишись
                        <span>в проект</span>
                    </div>
                    <div class="qr__hint">Наведи камеру телефона — и мы на связи</div>
                </div>
            </div>

        </div>

    </div>
</div>

<div class="export-bar" id="exportBar">
    <span class="export-status" id="status">Готов к экспорту</span>
    <button class="export-btn" id="previewBtn" style="background:linear-gradient(180deg,#fff2d8 0%,#f0d9a8 100%)">Проверить</button>
    <button class="export-btn" id="exportBtn">Скачать PNG</button>
    <button class="export-hide" id="hideBtn" title="Скрыть (вернуть — Esc)">×</button>
</div>

<script>
    (function () {
        const btn = document.getElementById('exportBtn');
        const previewBtn = document.getElementById('previewBtn');
        const hideBtn = document.getElementById('hideBtn');
        const status = document.getElementById('status');
        const post = document.getElementById('post');
        const bar = document.getElementById('exportBar');

        hideBtn.addEventListener('click', () => { bar.style.display = 'none'; });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') bar.style.display = 'flex';
        });

        async function render() {
            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
            }

            const photoUrl = getComputedStyle(
                document.querySelector('.post__photo')
            ).backgroundImage.match(/url\(["']?(.+?)["']?\)/);
            if (photoUrl && photoUrl[1]) {
                await new Promise((res) => {
                    const im = new Image();
                    im.crossOrigin = 'anonymous';
                    im.onload = im.onerror = res;
                    im.src = photoUrl[1];
                });
            }

            const prevZoom = post.style.zoom;
            post.style.zoom = '1';

            const dataUrl = await htmlToImage.toPng(post, {
                width: 1080,
                height: 1920,
                pixelRatio: 1,
                backgroundColor: '#8C1D24',
                cacheBust: true
            });

            post.style.zoom = prevZoom;
            return dataUrl;
        }

        previewBtn.addEventListener('click', async () => {
            previewBtn.disabled = true;
            status.textContent = 'Рендерю превью…';
            try {
                const dataUrl = await render();
                const w = window.open('', '_blank');
                w.document.write(
                    '<title>Превью</title>' +
                    '<body style="margin:0;background:#111;display:flex;justify-content:center">' +
                    '<img src="' + dataUrl + '" style="max-width:100%;height:auto">' +
                    '</body>'
                );
                status.textContent = 'Превью открыто';
                previewBtn.disabled = false;
            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка: ' + err.message;
                previewBtn.disabled = false;
            }
        });

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = 'Рендерю…';
            try {
                const dataUrl = await render();
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'shkit-davai-sygraem-zhizn.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
                status.textContent = 'Готово · 1080×1920';
                btn.disabled = false;
            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка: ' + err.message;
                btn.disabled = false;
            }
        });
    })();
</script>

</body>
</html>
