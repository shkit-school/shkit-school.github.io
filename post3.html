<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШКИТ — Давай сыграем жизнь</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap&subset=cyrillic,latin" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        background: #2a2a2a;
        min-height: 100vh;
        padding: 40px 20px 120px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* ============================================================
       ПЛАКАТ 1080×1920 — всегда в реальном размере
       ============================================================ */
    .post {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #6b0f14;
        color: #fff;
        isolation: isolate;
        box-shadow: 0 40px 120px -30px rgba(0,0,0,.8);
        flex: none;
    }

    /* Превью: уменьшаем только визуально, чтобы влезал в окно.
       zoom (а не transform) — Chrome учитывает корректно при скриншоте. */
    @media (max-width: 1180px), (max-height: 2000px) {
        html, body { padding: 20px 10px 100px; }
        .post { zoom: .48; }
    }
    @media (max-width: 640px) {
        .post { zoom: .32; }
    }

    /* Фон — красный занавес */
    .post__bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        filter: saturate(1.02) contrast(1.02) brightness(.95);
    }

    /* Тёплый ореол от прожектора */
    .post__glow {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
            radial-gradient(58% 34% at 50% 26%,
                rgba(255,236,190,.38) 0%,
                rgba(255,220,150,.18) 40%,
                rgba(255,200,120,.05) 65%,
                rgba(0,0,0,0) 80%);
        mix-blend-mode: screen;
    }

    /* Вуаль: сверху и снизу, центр не трогаем */
    .post__scrim {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
            linear-gradient(180deg,
                rgba(60,8,12,.62) 0%,
                rgba(60,8,12,.30) 14%,
                rgba(60,8,12,.05) 30%,
                rgba(60,8,12,.00) 45%,
                rgba(60,8,12,.35) 66%,
                rgba(60,8,12,.72) 86%,
                rgba(60,8,12,.88) 100%);
    }

    /* ============================================================
       КОНТЕНТ
       ============================================================ */
    .post__content {
        position: relative;
        z-index: 3;
        height: 100%;
        padding: 60px 80px 70px;
        display: flex;
        flex-direction: column;
        gap: 32px;
    }

    /* ---------- ВЕРХ ---------- */
    .post__top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex: none;
    }

    .post__logo {
        display: flex;
        align-items: center;
        gap: 18px;
    }
    .post__logo img {
        height: 84px;
        width: auto;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(0,0,0,.5));
    }

    .post__logo-text b {
        display: block;
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: .01em;
        text-shadow: 0 6px 20px rgba(0,0,0,.55);
    }
    .post__logo-text span {
        display: block;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: rgba(255,255,255,.85);
        margin-top: 7px;
        text-shadow: 0 4px 14px rgba(0,0,0,.55);
    }

    /* Плашка «3 месяца подготовки» */
    .post__stamp {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #3a0a0d;
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
        padding: 20px 34px;
        border-radius: 8px;
        transform: rotate(2deg);
        box-shadow:
            0 18px 40px -10px rgba(0,0,0,.6),
            inset 0 1px 0 rgba(255,255,255,.5);
        white-space: nowrap;
    }

    /* ---------- ЗАГОЛОВОК (чуть меньше, «Жизнь» в кадре) ---------- */
    .post__hero {
        flex: none;
    }

    .title {
        display: flex;
        flex-direction: column;
        line-height: .84;
        letter-spacing: -.03em;
        text-transform: uppercase;
        font-weight: 900;
    }

    .title__row { display: block; }

    .title__row--1 {
        font-size: 114px;
        font-weight: 800;
        font-style: italic;
        color: #fff;
        margin-left: 4px;
        text-shadow: 0 10px 34px rgba(0,0,0,.6);
    }
    .title__row--2 {
        font-size: 130px;
        font-weight: 900;
        font-style: italic;
        color: #fff;
        margin-left: 30px;
        text-shadow: 0 10px 34px rgba(0,0,0,.6);
    }
    .title__row--3 {
        font-size: 198px;
        font-weight: 900;
        color: #F4C77B;
        margin-left: 0;              /* вернули в кадр */
        margin-top: 4px;
        letter-spacing: -.05em;
        text-shadow:
            0 0 0 #3a0a0d,
            0 14px 46px rgba(0,0,0,.7);
        -webkit-text-stroke: 4px rgba(58,10,13,.55);
    }

    /* ---------- ФОТО ---------- */
    .post__photo {
        position: relative;
        flex: 1;
        min-height: 0;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
            0 34px 80px -22px rgba(0,0,0,.8),
            0 0 0 6px rgba(244,199,123,.35),
            0 0 0 7px rgba(58,10,13,.5);
    }
    .post__photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .post__photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
            rgba(0,0,0,0) 55%,
            rgba(0,0,0,.5) 100%);
        pointer-events: none;
    }

    /* Стикер */
    .sticker {
        position: absolute;
        right: 30px;
        bottom: 30px;
        z-index: 4;
        background: #FFF7E6;
        color: #3a0a0d;
        padding: 22px 30px 24px;
        border-radius: 10px;
        transform: rotate(-3deg);
        box-shadow:
            0 26px 60px -14px rgba(0,0,0,.75),
            0 0 0 3px rgba(255,247,230,.5);
        max-width: 400px;
    }
    .sticker__label {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #A02424;
        margin-bottom: 8px;
    }
    .sticker__text {
        font-size: 28px;
        font-weight: 900;
        line-height: 1.12;
        text-transform: uppercase;
    }
    .sticker::before {
        content: "";
        position: absolute;
        top: -16px;
        left: 50%;
        width: 120px;
        height: 32px;
        transform: translateX(-50%) rotate(-2deg);
        background: rgba(255,255,255,.35);
        border: 1px solid rgba(255,255,255,.6);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    /* ---------- ВЫЗОВ ---------- */
    .post__punch {
        flex: none;
        font-size: 44px;
        font-weight: 800;
        line-height: 1.2;
        text-transform: uppercase;
        color: #fff;
        max-width: 940px;
        text-shadow: 0 8px 26px rgba(0,0,0,.6);
    }
    .post__punch span { display: block; }
    .post__punch em {
        font-style: italic;
        color: #F4C77B;
    }

    /* ---------- НИЗ: факты одной строкой + QR ---------- */
    .post__bottom {
        flex: none;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 28px;
        align-items: end;
    }

    .facts {
        display: flex;
        gap: 12px;
        align-items: stretch;
        flex-wrap: nowrap;
    }

    .fact {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 18px 22px;
        border-radius: 16px;
        background: rgba(255,247,230,.94);
        color: #3a0a0d;
        box-shadow: 0 16px 36px -12px rgba(0,0,0,.6);
        white-space: nowrap;
        flex: 1;
        min-width: 0;
    }
    .fact__label {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #A02424;
    }
    .fact__value {
        font-size: 26px;
        font-weight: 900;
        color: #3a0a0d;
        line-height: 1;
    }
    .fact--price {
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
    }
    .fact--price .fact__label { color: #6b2a0a; }
    .fact--price .fact__value { color: #3a0a0d; }

    /* QR — крупный */
    .qr {
        display: flex;
        align-items: center;
        gap: 20px;
        flex: none;
    }
    .qr__img {
        width: 220px;
        height: 220px;
        background: #FFF7E6;
        border-radius: 16px;
        padding: 14px;
        object-fit: contain;
        display: block;
        box-shadow:
            0 22px 50px -16px rgba(0,0,0,.7),
            0 0 0 4px rgba(244,199,123,.45);
    }
    .qr__text {
        font-size: 20px;
        font-weight: 900;
        line-height: 1.2;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: .12em;
        max-width: 170px;
        text-shadow: 0 6px 18px rgba(0,0,0,.6);
    }
    .qr__text span {
        display: block;
        color: #F4C77B;
        margin-top: 8px;
        font-size: 22px;
    }

    /* ============================================================
       КНОПКА ЭКСПОРТА — вне .post, на картинку не попадает
       ============================================================ */
    .export-bar {
        position: fixed;
        right: 32px;
        bottom: 32px;
        z-index: 999;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .export-btn {
        font-family: inherit;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #3a0a0d;
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
        border: none;
        border-radius: 12px;
        padding: 18px 28px;
        cursor: pointer;
        box-shadow:
            0 18px 40px -10px rgba(0,0,0,.7),
            inset 0 1px 0 rgba(255,255,255,.5);
        transition: transform .15s ease, box-shadow .15s ease;
    }
    .export-btn:hover {
        transform: translateY(-2px);
        box-shadow:
            0 22px 48px -10px rgba(0,0,0,.8),
            inset 0 1px 0 rgba(255,255,255,.5);
    }
    .export-btn:active { transform: translateY(0); }
    .export-btn:disabled {
        opacity: .6;
        cursor: wait;
        transform: none;
    }

    .export-status {
        font-size: 13px;
        font-weight: 700;
        color: rgba(255,255,255,.75);
        background: rgba(0,0,0,.45);
        padding: 10px 16px;
        border-radius: 999px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }
</style>
</head>
<body>

<!-- ============================================================
     ПЛАКАТ
     ============================================================ -->
<div class="post" id="post">
    <img class="post__bg" src="assets/img/shapka2.webp" alt="">
    <div class="post__glow"></div>
    <div class="post__scrim"></div>

    <div class="post__content">

        <div class="post__top">
            <div class="post__logo">
                <img src="assets/img/logo-white-sm.png" alt="ШКИТ">
                <div class="post__logo-text">
                    <b>ШКИТ</b>
                    <span>Школа кино и театра</span>
                </div>
            </div>
            <div class="post__stamp">3 месяца подготовки</div>
        </div>

        <div class="post__hero">
            <h1 class="title">
                <span class="title__row title__row--1">Давай</span>
                <span class="title__row title__row--2">Сыграем</span>
                <span class="title__row title__row--3">Жизнь</span>
            </h1>
        </div>

        <div class="post__photo">
            <img src="assets/img/gal104.jpg" alt="Взрослые на занятии в ШКИТ">
            <div class="sticker">
                <div class="sticker__label">В подарок</div>
                <div class="sticker__text">Фотосессия<br>на сцене</div>
            </div>
        </div>

        <div class="post__punch">
            <span>Главная роль в спектакле</span>
            <span><em>на театральной сцене</em></span>
        </div>

        <div class="post__bottom">
            <div class="facts">
                <div class="fact">
                    <span class="fact__label">Ср · Вс</span>
                    <span class="fact__value">18:00 / 10:00</span>
                </div>
                <div class="fact fact--price">
                    <span class="fact__label">Проект</span>
                    <span class="fact__value">56 000 ₽</span>
                </div>
                <div class="fact">
                    <span class="fact__label">Запись</span>
                    <span class="fact__value">+7 919 404-01-23</span>
                </div>
            </div>

            <div class="qr">
                <img class="qr__img" src="assets/img/qr.png" alt="QR">
                <div class="qr__text">Запишись<span>в проект</span></div>
            </div>
        </div>

    </div>
</div>

<!-- ============================================================
     ПАНЕЛЬ ЭКСПОРТА
     ============================================================ -->
<div class="export-bar">
    <span class="export-status" id="status">Готов к экспорту</span>
    <button class="export-btn" id="exportBtn">Скачать PNG</button>
</div>

<script>
    (function () {
        const btn = document.getElementById('exportBtn');
        const status = document.getElementById('status');
        const post = document.getElementById('post');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = 'Рендерю…';

            try {
                // Ждём, пока шрифты загрузятся, чтобы текст не «поплыл»
                if (document.fonts && document.fonts.ready) {
                    await document.fonts.ready;
                }

                // Временно сбрасываем zoom на плакате — html2canvas
                // должен видеть его в реальных 1080×1920
                const prevZoom = post.style.zoom;
                post.style.zoom = '1';

                const canvas = await html2canvas(post, {
                    width: 1080,
                    height: 1920,
                    scale: 1,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#6b0f14',
                    logging: false
                });

                post.style.zoom = prevZoom;

                // Скачиваем
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'shkit-davai-sygraem-zhizn.png';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);

                    status.textContent = 'Готово · 1080×1920';
                    btn.disabled = false;
                }, 'image/png');

            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка: ' + err.message;
                btn.disabled = false;
            }
        });
    })();
</script>

</body>
</html>
