
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШКИТ — Давай сыграем жизнь</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap&subset=cyrillic,latin" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        background: #2a2a2a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
    }

    /* ============================================================
       ПЛАКАТ 1080×1920
       ============================================================ */
    .post {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1b1b1b;
        color: #fff;
        isolation: isolate;
        box-shadow: 0 40px 120px -30px rgba(0,0,0,.8);
        transform-origin: top center;
    }

    /* Фон — сцена (прожекторы, свет) */
    .post__bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        filter: saturate(1.05) contrast(1.02) brightness(.85);
        background:
            radial-gradient(100% 70% at 50% 30%, #6b5a4a 0%, #2e2a26 55%, #16140f 100%);
    }

    /* Лёгкая вуаль — только чтобы текст читался, без мрака */
    .post__scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
            linear-gradient(180deg,
                rgba(15,15,15,.55) 0%,
                rgba(15,15,15,.25) 18%,
                rgba(15,15,15,.10) 38%,
                rgba(15,15,15,.45) 68%,
                rgba(15,15,15,.80) 100%);
    }

    /* Еле заметное зерно — текстура, не грязь */
    .post__grain {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: .05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ============================================================
       КОНТЕНТ
       ============================================================ */
    .post__content {
        position: relative;
        z-index: 3;
        height: 100%;
        padding: 70px 80px 80px;
        display: flex;
        flex-direction: column;
        gap: 36px;
    }

    /* ---------- ВЕРХ ---------- */
    .post__top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex: none;
    }

    .post__logo {
        display: flex;
        align-items: center;
        gap: 18px;
    }
    .post__logo img { height: 72px; width: auto; display: block; }

    .post__logo-text b {
        display: block;
        font-size: 34px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: .01em;
    }
    .post__logo-text span {
        display: block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: rgba(255,255,255,.7);
        margin-top: 6px;
    }

    .post__stamp {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #1b1b1b;
        background: #F28B87;
        padding: 16px 28px;
        border-radius: 6px;
        transform: rotate(2deg);
        box-shadow: 0 14px 34px -10px rgba(242,139,135,.6);
        white-space: nowrap;
    }

    /* ---------- ЗАГОЛОВОК ---------- */
    .post__hero {
        flex: none;
    }

    .title {
        display: flex;
        flex-direction: column;
        line-height: .84;
        letter-spacing: -.03em;
        text-transform: uppercase;
        font-weight: 900;
    }

    .title__row { display: block; }

    .title__row--1 {
        font-size: 130px;
        font-weight: 800;
        font-style: italic;
        color: #fff;
        margin-left: 4px;
        text-shadow: 0 10px 34px rgba(0,0,0,.5);
    }
    .title__row--2 {
        font-size: 148px;
        font-weight: 900;
        font-style: italic;
        color: #fff;
        margin-left: 32px;
        text-shadow: 0 10px 34px rgba(0,0,0,.5);
    }
    .title__row--3 {
        font-size: 220px;
        font-weight: 900;
        color: #F28B87;
        margin-left: -12px;
        margin-top: 4px;
        letter-spacing: -.05em;
        text-shadow: 0 16px 46px rgba(0,0,0,.6);
    }

    /* ---------- ФОТО БЛОК ---------- */
    .post__photo {
        position: relative;
        flex: 1;
        min-height: 0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 30px 70px -20px rgba(0,0,0,.7);
        border: 1px solid rgba(255,255,255,.12);
    }
    .post__photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    /* лёгкое затемнение снизу фото, чтобы стикер читался */
    .post__photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
            rgba(0,0,0,0) 55%,
            rgba(0,0,0,.45) 100%);
        pointer-events: none;
    }

    /* Стикер поверх фото */
    .sticker {
        position: absolute;
        right: 28px;
        bottom: 28px;
        z-index: 4;
        background: #fff;
        color: #1b1b1b;
        padding: 20px 28px 22px;
        border-radius: 8px;
        transform: rotate(-3deg);
        box-shadow: 0 24px 60px -14px rgba(0,0,0,.7);
        max-width: 380px;
    }
    .sticker__label {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #BC3636;
        margin-bottom: 8px;
    }
    .sticker__text {
        font-size: 26px;
        font-weight: 900;
        line-height: 1.12;
        text-transform: uppercase;
    }
    .sticker::before {
        content: "";
        position: absolute;
        top: -16px;
        left: 50%;
        width: 110px;
        height: 30px;
        transform: translateX(-50%) rotate(-2deg);
        background: rgba(255,255,255,.35);
        border: 1px solid rgba(255,255,255,.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    /* ---------- ВЫЗОВ ---------- */
    .post__punch {
        flex: none;
        font-size: 40px;
        font-weight: 800;
        line-height: 1.22;
        text-transform: uppercase;
        color: #fff;
        max-width: 880px;
        text-shadow: 0 6px 22px rgba(0,0,0,.5);
    }
    .post__punch span { display: block; }
    .post__punch em {
        font-style: italic;
        color: #F28B87;
    }

    /* ---------- НИЗ: факты + QR ---------- */
    .post__bottom {
        flex: none;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 32px;
        align-items: end;
    }

    .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 16px;
        align-items: stretch;
    }

    .fact {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 18px 26px;
        border-radius: 14px;
        background: rgba(255,255,255,.10);
        border: 1.5px solid rgba(255,255,255,.22);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        white-space: nowrap;
    }
    .fact__label {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #F28B87;
    }
    .fact__value {
        font-size: 30px;
        font-weight: 900;
        color: #fff;
        line-height: 1;
    }
    .fact--price {
        background: #F28B87;
        border-color: #F28B87;
    }
    .fact--price .fact__label { color: rgba(27,27,27,.7); }
    .fact--price .fact__value { color: #1b1b1b; }

    /* QR */
    .qr {
        display: flex;
        align-items: center;
        gap: 18px;
        flex: none;
    }
    .qr__img {
        width: 150px;
        height: 150px;
        background: #fff;
        border-radius: 12px;
        padding: 10px;
        object-fit: contain;
        display: block;
    }
    .qr__text {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.25;
        color: rgba(255,255,255,.9);
        text-transform: uppercase;
        letter-spacing: .12em;
        max-width: 140px;
    }
    .qr__text span {
        display: block;
        color: #F28B87;
        margin-top: 6px;
    }

    /* ============================================================
       ПРЕДПРОСМОТР
       ============================================================ */
    @media (max-width: 1180px), (max-height: 2000px) {
        html, body { padding: 0; }
        .post {
            transform: scale(.5);
            margin-bottom: -960px;
        }
    }
    @media (max-width: 640px) {
        .post { transform: scale(.32); margin-bottom: -1305px; }
    }
</style>
</head>
<body>

<div class="post">
    <!-- Фон: сцена -->
    <img class="post__bg" src="assets/img/scene.jpg" alt="">
    <div class="post__scrim"></div>
    <div class="post__grain"></div>

    <div class="post__content">

        <!-- Верх -->
        <div class="post__top">
            <div class="post__logo">
                <img src="assets/img/logo-white-sm.png" alt="ШКИТ">
                <div class="post__logo-text">
                    <b>ШКИТ</b>
                    <span>Школа кино и театра</span>
                </div>
            </div>
            <div class="post__stamp">18+ · взрослым</div>
        </div>

        <!-- Заголовок -->
        <div class="post__hero">
            <h1 class="title">
                <span class="title__row title__row--1">Давай</span>
                <span class="title__row title__row--2">Сыграем</span>
                <span class="title__row title__row--3">Жизнь</span>
            </h1>
        </div>

        <!-- Фото gal104 -->
        <div class="post__photo">
            <img src="assets/img/gal104.jpg" alt="Взрослые на занятии в ШКИТ">
            <div class="sticker">
                <div class="sticker__label">В подарок</div>
                <div class="sticker__text">Фотосессия<br>на сцене</div>
            </div>
        </div>

        <!-- Вызов -->
        <div class="post__punch">
            <span>Театральный проект для взрослых.</span>
            <span><em>Без опыта. Без страха. Без «поздно».</em></span>
        </div>

        <!-- Факты + QR -->
        <div class="post__bottom">
            <div class="facts">
                <div class="fact">
                    <span class="fact__label">Ср · Вс</span>
                    <span class="fact__value">18:00 / 10:00</span>
                </div>
                <div class="fact fact--price">
                    <span class="fact__label">Проект</span>
                    <span class="fact__value">56 000 ₽</span>
                </div>
                <div class="fact">
                    <span class="fact__label">Запись</span>
                    <span class="fact__value">+7 919 404-01-23</span>
                </div>
            </div>

            <div class="qr">
                <img class="qr__img" src="assets/img/qr.png" alt="QR">
                <div class="qr__text">Запишись<span>в проект</span></div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
