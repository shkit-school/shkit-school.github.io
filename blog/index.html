        .blog-grid {

        .blog-card {

            flex-direction: column;
        }
        .blog-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        .blog-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .blog-card-date {
            font-size: 12px;
            color: var(--grey);
            font-weight: 600;
            margin-bottom: 8px;
        }
        .blog-card h3 {
            font-size: 18px;
            margin-bottom: 16px;
        }
        .blog-card a {
            margin-top: auto;
            color: var(--coral-ink);
            font-weight: 700;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .blog-grid { grid-template-columns: 1fr; }
        }
