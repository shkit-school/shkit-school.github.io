<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ШКИТ — Мой бенефис</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap&subset=cyrillic,latin" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        background: #2a2a2a;
        min-height: 100vh;
        padding: 40px 20px 80px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* ============================================================
       ПЛАКАТ 1080×1350 — «МОЙ БЕНЕФИС»
       ============================================================ */
    .post {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #7a5a1e;
        color: #fff;
        isolation: isolate;
        box-shadow: 0 40px 120px -30px rgba(0,0,0,.8);
        flex: none;
    }

    @media (max-width: 1180px), (max-height: 1500px) {
        html, body { padding: 20px 10px 70px; }
        .post { zoom: .62; }
    }
    @media (max-width: 640px) {
        .post { zoom: .36; }
    }

    /* ============================================================
       ФОН — ЗОЛОТОЙ СЛИТОК
       ============================================================ */

    .post__bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(120% 85% at 50% 30%,
                #F5D271 0%,
                #E5BE58 25%,
                #C99A3C 50%,
                #A87B28 75%,
                #7a5a1e 100%);
    }

    .post__lights {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
            radial-gradient(28% 68% at 30% 0%,
                rgba(255,235,175,.42) 0%,
                rgba(255,225,155,.20) 35%,
                rgba(255,220,140,0)   70%),
            radial-gradient(32% 78% at 50% 0%,
                rgba(255,245,200,.55) 0%,
                rgba(255,235,170,.28) 35%,
                rgba(255,225,150,0)   72%),
            radial-gradient(28% 68% at 70% 0%,
                rgba(255,235,175,.42) 0%,
                rgba(255,225,155,.20) 35%,
                rgba(255,220,140,0)   70%),
            radial-gradient(24% 60% at 32% 1%,
                rgba(255,230,165,.22) 0%,
                rgba(255,220,140,0)   60%),
            radial-gradient(26% 66% at 68% 1%,
                rgba(255,230,165,.22) 0%,
                rgba(255,220,140,0)   60%);
    }

    .post__haze {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
            radial-gradient(52% 24% at 50% 4%,
                rgba(255,245,200,.38) 0%,
                rgba(255,225,150,.15) 40%,
                rgba(0,0,0,0) 75%);
    }

    .post__shine {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
            radial-gradient(38% 22% at 22% 16%,
                rgba(255,255,235,.42) 0%,
                rgba(255,250,215,.20) 30%,
                rgba(255,245,200,.06) 55%,
                rgba(0,0,0,0) 75%),
            radial-gradient(24% 14% at 78% 8%,
                rgba(255,255,240,.26) 0%,
                rgba(255,250,215,.10) 40%,
                rgba(0,0,0,0) 75%);
    }

    .post__sparkles {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        opacity: .75;
        background-image:
            radial-gradient(circle at 12% 18%, rgba(255,250,220,.95) 1px, transparent 2px),
            radial-gradient(circle at 88% 12%, rgba(255,248,210,.85) 1.2px, transparent 2.4px),
            radial-gradient(circle at 32% 42%, rgba(255,252,230,.75) 0.8px, transparent 1.8px),
            radial-gradient(circle at 68% 28%, rgba(255,250,220,.9) 1px, transparent 2.2px),
            radial-gradient(circle at 22% 68%, rgba(255,248,210,.7) 0.8px, transparent 2px),
            radial-gradient(circle at 82% 62%, rgba(255,252,230,.85) 1.1px, transparent 2.2px),
            radial-gradient(circle at 48% 88%, rgba(255,250,220,.7) 0.9px, transparent 2px),
            radial-gradient(circle at 92% 82%, rgba(255,245,200,.75) 1px, transparent 2px);
        background-size:
            240px 240px,
            320px 320px,
            280px 280px,
            360px 360px,
            300px 300px,
            340px 340px,
            380px 380px,
            400px 400px;
    }

    .post__dust {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: .35;
        background-image:
            radial-gradient(circle at 20% 30%, rgba(255,250,225,.8) 0.5px, transparent 1.5px),
            radial-gradient(circle at 70% 15%, rgba(255,248,215,.65) 0.5px, transparent 1.5px),
            radial-gradient(circle at 45% 60%, rgba(255,250,225,.55) 0.5px, transparent 1.5px),
            radial-gradient(circle at 85% 45%, rgba(255,248,215,.5) 0.5px, transparent 1.5px),
            radial-gradient(circle at 12% 75%, rgba(255,250,225,.45) 0.5px, transparent 1.5px);
        background-size:
            180px 180px,
            260px 260px,
            220px 220px,
            300px 300px,
            340px 340px;
        -webkit-mask-image: linear-gradient(180deg,
            rgba(0,0,0,1) 0%,
            rgba(0,0,0,.7) 40%,
            rgba(0,0,0,.2) 70%,
            rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(180deg,
            rgba(0,0,0,1) 0%,
            rgba(0,0,0,.7) 40%,
            rgba(0,0,0,.2) 70%,
            rgba(0,0,0,0) 100%);
    }

    .post__wordmark {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .post__wordmark span {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 440px;
        letter-spacing: -.06em;
        text-transform: uppercase;
        color: rgba(140,29,36,.09);
        white-space: nowrap;
        transform: rotate(6deg) translateY(-10px);
        line-height: .8;
        user-select: none;
    }

    .post__grid {
        position: absolute;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        opacity: .035;
        background-image:
            repeating-linear-gradient(0deg,
                rgba(70,45,10,1) 0 1px,
                transparent 1px 60px),
            repeating-linear-gradient(90deg,
                rgba(70,45,10,1) 0 1px,
                transparent 1px 60px);
    }

    .post__vignette {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        background:
            radial-gradient(130% 95% at 50% 50%,
                rgba(0,0,0,0) 50%,
                rgba(20,10,0,.22) 85%,
                rgba(15,8,0,.40) 100%);
    }

    .post__grain {
        position: absolute;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        opacity: .07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        background-size: 120px 120px;
    }

    .post__frame {
        position: absolute;
        inset: 24px;
        z-index: 10;
        pointer-events: none;
        border: 2px solid rgba(140,29,36,.7);
    }
    .post__frame::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(140,29,36,.35);
    }

    /* ============================================================
       КОНТЕНТ
       ============================================================ */
    .post__content {
        position: relative;
        z-index: 20;
        height: 100%;
        padding: 52px 64px 56px;
        display: flex;
        flex-direction: column;
    }

    /* ---------- ВЕРХ ---------- */
    .post__top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 72px;
        flex: none;
    }

    .post__stamp {
        font-size: 19px;
        font-weight: 900;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #F4C77B;
        background: linear-gradient(180deg, #A02424 0%, #7a1418 100%);
        padding: 16px 28px;
        border-radius: 8px;
        transform: rotate(-2deg);
        box-shadow:
            0 18px 40px -10px rgba(0,0,0,.5),
            inset 0 1px 0 rgba(255,255,255,.15);
        white-space: nowrap;
    }

    .post__logo {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .post__logo img {
        height: 72px;
        width: auto;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(0,0,0,.4));
        order: 2;
    }
    .post__logo-text {
        order: 1;
        text-align: right;
    }
    .post__logo-text b {
        display: block;
        font-size: 32px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: .01em;
        color: #8C1D24;
        text-shadow: 0 2px 10px rgba(255,245,200,.55);
    }
    .post__logo-text span {
        display: block;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: rgba(60,35,5,.9);
        margin-top: 6px;
    }

    /* ---------- ЗАГОЛОВОК + QR ---------- */
    .post__hero-row {
        position: relative;
        z-index: 20;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
        margin-top: 26px;
        margin-bottom: -50px;
    }

    .post__qr-top {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(-2deg);
    }

    .qr__img {
        width: 170px;
        height: 170px;
        background: #FFF7E6;
        border-radius: 12px;
        padding: 10px;
        object-fit: contain;
        display: block;
        box-shadow:
            0 18px 44px -12px rgba(0,0,0,.6),
            0 0 0 4px rgba(140,29,36,.7);
    }

    .post__hero {
        flex: 1;
        min-width: 0;
        text-align: center;
        transform: rotate(1.5deg);
    }

    .title {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: .82;
        letter-spacing: -.04em;
        text-transform: uppercase;
        font-weight: 900;
    }

    .title__row { display: block; }

    .title__row--1 {
        font-size: 240px;
        font-weight: 900;
        font-style: italic;
        color: #8C1D24;
        letter-spacing: -.06em;
        line-height: .82;
        text-shadow:
            -2px -2px 0 rgba(255,250,230,.75),
             2px -2px 0 rgba(255,250,230,.75),
            -2px  2px 0 rgba(255,250,230,.75),
             2px  2px 0 rgba(255,250,230,.75),
             0 18px 50px rgba(0,0,0,.45);
    }

    .title__divider {
        width: 340px;
        height: 3px;
        background: linear-gradient(90deg,
            rgba(140,29,36,0) 0%,
            #8C1D24 20%,
            #8C1D24 80%,
            rgba(140,29,36,0) 100%);
        margin: 12px 0 14px;
        border-radius: 2px;
    }

    .title__row--2 {
        font-size: 118px;
        font-weight: 900;
        font-style: normal;
        color: #8C1D24;
        letter-spacing: .02em;
        line-height: .9;
        text-shadow:
            -2px -2px 0 rgba(255,250,230,.65),
             2px -2px 0 rgba(255,250,230,.65),
            -2px  2px 0 rgba(255,250,230,.65),
             2px  2px 0 rgba(255,250,230,.65),
             0 14px 40px rgba(0,0,0,.4);
    }

    /* ---------- ФОТО ---------- */
    .post__photo {
        position: relative;
        height: 540px;
        flex: none;
        margin-top: 20px;
        overflow: hidden;
        box-shadow:
            0 34px 80px -22px rgba(0,0,0,.7),
            0 0 0 4px rgba(140,29,36,.75),
            0 0 0 5px rgba(0,0,0,.35);
        background-image: url('assets/img/adults.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        transform: rotate(-1.5deg);
        transform-origin: center center;
        z-index: 5;
    }

    .post__photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
            rgba(0,0,0,0) 55%,
            rgba(0,0,0,.5) 100%);
        pointer-events: none;
    }

    /* ---------- СТИКЕР «ФОТОСЕССИЯ» ---------- */
    .sticker {
        position: absolute;
        right: 50px;
        bottom: 26px;
        z-index: 6;
        background: linear-gradient(180deg, #A02424 0%, #7a1418 100%);
        color: #F4C77B;
        padding: 26px 32px 28px;
        border-radius: 10px;
        transform: rotate(-4deg);
        box-shadow:
            0 26px 60px -14px rgba(0,0,0,.85),
            0 0 0 3px rgba(244,199,123,.65);
        min-width: 300px;
    }

    .sticker__label {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #F4C77B;
        margin-bottom: 10px;
    }

    .sticker__text {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.3;
        color: rgba(244,199,123,.95);
        white-space: normal;
    }

    .sticker::before {
        content: "";
        position: absolute;
        top: -14px;
        left: 50%;
        width: 110px;
        height: 28px;
        transform: translateX(-50%) rotate(2deg);
        background: rgba(255,247,230,.45);
        border: 1px solid rgba(255,247,230,.7);
    }

    /* ============================================================
       ПОДПИСЬ ПОД ФОТО — с крупным белым «ВЫ»
       ============================================================ */
    .post__punch {
        flex: none;
        margin-top: 30px;
        font-size: 52px;
        font-weight: 900;
        line-height: 1.25;
        text-transform: none;
        color: #8C1D24;
        text-align: center;
        letter-spacing: -.01em;
        position: relative;
        z-index: 10;
        text-shadow:
            -1.5px -1.5px 0 rgba(255,250,230,.8),
             1.5px -1.5px 0 rgba(255,250,230,.8),
            -1.5px  1.5px 0 rgba(255,250,230,.8),
             1.5px  1.5px 0 rgba(255,250,230,.8),
             0 8px 22px rgba(0,0,0,.35);
    }
    .post__punch span { display: block; }

    /* ВЫ — крупное, БЕЛОЕ, с тёмной обводкой. Может залезать на фото. */
    .punch-you {
        display: inline-block;
        font-size: 86px;
        font-weight: 900;
        line-height: .9;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: #FFF7E6;
        transform: rotate(-6deg) translateY(-6px);
        position: relative;
        padding: 0 12px;
        margin-right: 6px;
        vertical-align: baseline;
        text-shadow:
            -2px -2px 0 rgba(60,10,10,.85),
             2px -2px 0 rgba(60,10,10,.85),
            -2px  2px 0 rgba(60,10,10,.85),
             2px  2px 0 rgba(60,10,10,.85),
             0 10px 26px rgba(0,0,0,.55);
    }
    .punch-you::after {
        content: "";
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: -6px;
        height: 6px;
        background: linear-gradient(90deg,
            rgba(244,199,123,0) 0%,
            #F4C77B 15%,
            #F4C77B 85%,
            rgba(244,199,123,0) 100%);
        border-radius: 3px;
        transform: rotate(-2deg);
    }

    /* «главный герой» — акцент с золотым подчёркиванием */
    .post__punch .accent {
        position: relative;
        display: inline-block;
        font-size: 56px;
        color: #7a1418;
    }
    .post__punch .accent::after {
        content: "";
        position: absolute;
        left: -4px;
        right: -4px;
        bottom: 0;
        height: 6px;
        background: linear-gradient(90deg,
            rgba(244,199,123,0) 0%,
            #F4C77B 15%,
            #F4C77B 85%,
            rgba(244,199,123,0) 100%);
        border-radius: 3px;
        transform: rotate(-1.5deg);
    }

    .post__punch em {
        font-style: italic;
        font-weight: 900;
        color: #5e0f13;
    }

    /* ---------- НИЗ ---------- */
    .post__bottom {
        flex: none;
        margin-top: auto;
        padding-top: 22px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: end;
    }

    .fact-exclusive {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 20px 32px;
        height: 108px;
        border-radius: 14px;
        background: linear-gradient(180deg, #A02424 0%, #7a1418 100%);
        color: #F4C77B;
        box-shadow:
            0 20px 44px -12px rgba(0,0,0,.55),
            inset 0 1px 0 rgba(255,255,255,.15);
    }
    .fact-exclusive__label {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: rgba(244,199,123,.75);
    }
    .fact-exclusive__value {
        font-size: 42px;
        font-weight: 900;
        color: #F4C77B;
        line-height: 1;
        letter-spacing: .04em;
        text-transform: uppercase;
    }

    .fact-phone {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 16px 24px;
        height: 108px;
        border-radius: 14px;
        background: #FFF7E6;
        color: #2a1a0a;
        box-shadow: 0 16px 36px -12px rgba(0,0,0,.45);
        white-space: nowrap;
    }
    .fact-phone .fact__label {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #A02424;
    }
    .fact-phone .fact__value {
        font-size: 26px;
        font-weight: 900;
        color: #2a1a05;
        line-height: 1;
    }

    /* ============================================================
       КНОПКА ЭКСПОРТА — уменьшена, надёжно внизу
       ============================================================ */
    .export-bar {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .export-btn {
        font-family: inherit;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #2a1a0a;
        background: linear-gradient(180deg, #F7D28A 0%, #E8B96A 100%);
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        box-shadow: 0 10px 24px -6px rgba(0,0,0,.7);
        transition: transform .15s ease;
    }
    .export-btn:hover { transform: translateY(-2px); }
    .export-btn:active { transform: translateY(0); }
    .export-btn:disabled { opacity: .6; cursor: wait; transform: none; }

    .export-status {
        font-size: 11px;
        font-weight: 700;
        color: rgba(255,255,255,.75);
        background: rgba(0,0,0,.5);
        padding: 6px 12px;
        border-radius: 999px;
    }

    .export-hide {
        font-size: 11px;
        font-weight: 700;
        color: rgba(255,255,255,.55);
        background: rgba(0,0,0,.4);
        border: none;
        border-radius: 999px;
        padding: 6px 10px;
        cursor: pointer;
        font-family: inherit;
    }
</style>
</head>
<body>

<div class="post" id="post">

    <div class="post__bg"></div>
    <div class="post__lights"></div>
    <div class="post__haze"></div>
    <div class="post__shine"></div>
    <div class="post__sparkles"></div>
    <div class="post__dust"></div>
    <div class="post__wordmark"><span>Бенефис</span></div>
    <div class="post__grid"></div>
    <div class="post__vignette"></div>
    <div class="post__grain"></div>
    <div class="post__frame"></div>

    <div class="post__content">

        <div class="post__top">
            <div class="post__stamp">3 месяца подготовки</div>
            <div class="post__logo">
                <img src="assets/img/logo-white-sm.png" alt="ШКИТ">
                <div class="post__logo-text">
                    <b>ШКИТ</b>
                    <span>Школа кино и театра</span>
                </div>
            </div>
        </div>

        <div class="post__hero-row">

            <div class="post__qr-top">
                <img class="qr__img" src="assets/img/qr.png" alt="QR">
            </div>

            <div class="post__hero">
                <h1 class="title">
                    <span class="title__row title__row--1">Мой</span>
                    <span class="title__divider"></span>
                    <span class="title__row title__row--2">Бенефис</span>
                </h1>
            </div>

        </div>

        <div class="post__photo">
            <div class="sticker">
                <div class="sticker__label">Фотосессия</div>
                <div class="sticker__text">Ваш портрет<br>становится<br>афишей</div>
            </div>
        </div>

        <!-- Подпись с белым «ВЫ» -->
        <div class="post__punch">
            <span><span class="punch-you">Вы</span> — <span class="accent">главный герой</span>, автор</span>
            <span>и <em>легенда</em> одного вечера.</span>
        </div>

        <div class="post__bottom">

            <div class="fact-exclusive">
                <span class="fact-exclusive__label">Формат</span>
                <span class="fact-exclusive__value">Эксклюзив</span>
            </div>

            <div class="fact-phone">
                <span class="fact__label">Запись</span>
                <span class="fact__value">+7 909 090-44-71</span>
            </div>

        </div>

    </div>
</div>

<div class="export-bar" id="exportBar">
    <span class="export-status" id="status">Готов к экспорту</span>
    <button class="export-btn" id="previewBtn">Проверить</button>
    <button class="export-btn" id="exportBtn">Скачать PNG</button>
    <button class="export-hide" id="hideBtn" title="Скрыть (вернуть — Esc)">×</button>
</div>

<script>
    (function () {
        const btn = document.getElementById('exportBtn');
        const previewBtn = document.getElementById('previewBtn');
        const hideBtn = document.getElementById('hideBtn');
        const status = document.getElementById('status');
        const post = document.getElementById('post');
        const bar = document.getElementById('exportBar');

        hideBtn.addEventListener('click', () => { bar.style.display = 'none'; });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') bar.style.display = 'flex';
        });

        async function render() {
            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
            }

            const photoUrl = getComputedStyle(
                document.querySelector('.post__photo')
            ).backgroundImage.match(/url\(["']?(.+?)["']?\)/);
            if (photoUrl && photoUrl[1]) {
                await new Promise((res) => {
                    const im = new Image();
                    im.crossOrigin = 'anonymous';
                    im.onload = im.onerror = res;
                    im.src = photoUrl[1];
                });
            }

            const prevZoom = post.style.zoom;
            post.style.zoom = '1';

            const dataUrl = await htmlToImage.toPng(post, {
                width: 1080,
                height: 1350,
                pixelRatio: 1,
                backgroundColor: '#7a5a1e',
                cacheBust: true
            });

            post.style.zoom = prevZoom;
            return dataUrl;
        }

        previewBtn.addEventListener('click', async () => {
            previewBtn.disabled = true;
            status.textContent = 'Рендерю превью…';
            try {
                const dataUrl = await render();
                const w = window.open('', '_blank');
                w.document.write(
                    '<title>Превью</title>' +
                    '<body style="margin:0;background:#111;display:flex;justify-content:center">' +
                    '<img src="' + dataUrl + '" style="max-width:100%;height:auto">' +
                    '</body>'
                );
                status.textContent = 'Превью открыто';
                previewBtn.disabled = false;
            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка: ' + err.message;
                previewBtn.disabled = false;
            }
        });

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = 'Рендерю…';
            try {
                const dataUrl = await render();
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'shkit-moy-benefis-1350.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
                status.textContent = 'Готово · 1080×1350';
                btn.disabled = false;
            } catch (err) {
                console.error(err);
                status.textContent = 'Ошибка: ' + err.message;
                btn.disabled = false;
            }
        });
    })();
</script>

</body>
</html>
